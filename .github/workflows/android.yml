name: Native Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - .github/workflows/android.yml
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Build and verify Android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

  device-tests:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            cd apps/android
            ./gradlew --no-daemon connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class='fun.yunle.apps.HostChromeTest,fun.yunle.apps.RenderProcessTerminationTest,fun.yunle.apps.CatalogSessionFlowTest#catalogSearchDetailTryMinimizeAndResumeKeepsSameSession,fun.yunle.apps.CatalogSessionFlowTest#catalogErrorRetriesAndRotationPreservesLoadedStateWithoutRefetch,fun.yunle.apps.CatalogSessionFlowTest#wideScreenTwoPaneAndDarkLargeFontAndKeyboardNavigationWork'
            ./gradlew --no-daemon connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class='fun.yunle.apps.WebProfileIsolationTest'
            ./gradlew --no-daemon connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class='fun.yunle.apps.CatalogSessionFlowTest#publicCatalogOpensOneRealGuestAppReadOnly' \
              -Pandroid.testInstrumentationRunnerArguments.publicCatalogLive=1 || echo "::warning::Read-only live public catalog smoke check failed"
