name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Web and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Documentation build
        run: pnpm run docs:build

      - name: Verify server runtime dependencies
        run: pnpm run check:server-runtime-deps

      - name: Unit tests
        run: pnpm run test:unit

      - name: Nuxt tests
        run: pnpm run test:nuxt

  e2e:
    name: Chromium smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/mobile exec playwright install --with-deps chromium

      - name: Chromium smoke tests
        run: pnpm run test:e2e --project=chromium

      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-traces
          path: |
            apps/mobile/test-results/**
            apps/mobile/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
