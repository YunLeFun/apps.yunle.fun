name: Native iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native iOS · Xcode 27
    # GitHub's standard Xcode 27 image is currently a public preview.
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Xcode and locked package versions
        env:
          YLF_CI_OUTPUT: ${{ runner.temp }}/yunlefun-ios-ci
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          mkdir -p "$YLF_CI_OUTPUT"
          echo "YLF_CI_OUTPUT=$YLF_CI_OUTPUT" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages"
          git diff --exit-code -- apps/ios/YunleFun.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Create isolated iOS 27 simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          simulator = subprocess.check_output([
              "xcrun", "simctl", "create", "YunleFun CI",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro",
              "com.apple.CoreSimulator.SimRuntime.iOS-27-0",
          ], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("id=" + simulator + "\n")
          print("Created isolated iOS 27 test simulator: " + simulator)
          subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], check=True)
          PY

      - name: Native unit, integration and guest UI tests
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
          TEST_RUNNER_YUNLEFUN_COOKIE_TRACE: '1'
        run: |
          set -o pipefail
          xcrun simctl spawn "$YLF_CI_SIMULATOR" log stream --style compact --level debug \
            --predicate 'subsystem == "com.apple.WebKit" AND (category == "ProcessSuspension" OR category == "Process")' \
            > "$YLF_CI_OUTPUT/network-lifecycle.log" 2>&1 &
          YLF_LOG_PID=$!
          python3 .github/scripts/sample-cookie-stall.py &
          YLF_SAMPLE_PID=$!
          trap 'kill "$YLF_LOG_PID" "$YLF_SAMPLE_PID" 2>/dev/null || true' EXIT
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Debug -destination "platform=iOS Simulator,id=$YLF_CI_SIMULATOR" \
            -derivedDataPath "$YLF_CI_OUTPUT/debug" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing \
            2>&1 | tee "$YLF_CI_OUTPUT/build.log"
          YLF_FAILED=0
          for YLF_SCENARIO in none1 store webview none2; do
            YLF_TESTS=(-only-testing:YunleFunTests/HomeLayoutVisualTests)
            YLF_MODE="$YLF_SCENARIO"
            if [[ "$YLF_SCENARIO" == none* ]]; then YLF_MODE=none; fi
            set +e
            TEST_RUNNER_YUNLEFUN_COOKIE_LIFETIME="$YLF_MODE" xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
              -configuration Debug -destination "platform=iOS Simulator,id=$YLF_CI_SIMULATOR" \
              -derivedDataPath "$YLF_CI_OUTPUT/debug" \
              -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
              -resultBundlePath "$YLF_CI_OUTPUT/$YLF_SCENARIO.xcresult" \
              -collect-test-diagnostics never -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
              -test-iterations 2 -test-repetition-relaunch-enabled YES \
              -parallel-testing-enabled NO "${YLF_TESTS[@]}" \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building \
              2>&1 | tee "$YLF_CI_OUTPUT/tests-$YLF_SCENARIO.log"
            YLF_STATUS=${PIPESTATUS[0]}
            set -e
            echo "COOKIE_SCENARIO $YLF_SCENARIO exit=$YLF_STATUS"
            if [ "$YLF_STATUS" -ne 0 ]; then YLF_FAILED=1; fi
          done
          exit "$YLF_FAILED"

      - name: Compile native Release for simulator
        if: ${{ false }}
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$YLF_CI_OUTPUT/release" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build \
            2>&1 | tee "$YLF_CI_OUTPUT/release.log"

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yunlefun-ios-ci/*.log
            ${{ runner.temp }}/yunlefun-ios-ci/*.xcresult
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove isolated simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl shutdown "$YLF_CI_SIMULATOR" || true
          xcrun simctl delete "$YLF_CI_SIMULATOR"
