name: Native iOS CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Simulator validation target
        type: choice
        default: current
        options: [current, ios16]
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}-${{ inputs.target || 'current' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ inputs.target == 'ios16' && 'Native iOS · iOS 16 compatibility' || 'Native iOS · Xcode 27' }}
    # GitHub's standard Xcode 27 image is currently a public preview.
    # iOS 16 needs a pre-27 Xcode and host; it is an explicit additional lane.
    runs-on: ${{ inputs.target == 'ios16' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: ${{ inputs.target == 'ios16' && 45 || 35 }}
    env:
      DEVELOPER_DIR: ${{ inputs.target == 'ios16' && '/Applications/Xcode_26.6.app/Contents/Developer' || '/Applications/Xcode_27.0.app/Contents/Developer' }}
      YLF_CI_RUNTIME: ${{ inputs.target == 'ios16' && 'com.apple.CoreSimulator.SimRuntime.iOS-16-0' || 'com.apple.CoreSimulator.SimRuntime.iOS-27-0' }}
      YLF_CI_DEVICE: ${{ inputs.target == 'ios16' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-14' || 'com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro' }}
      YLF_CI_TARGET: ${{ inputs.target || 'current' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Xcode and locked package versions
        env:
          YLF_CI_OUTPUT: ${{ runner.temp }}/yunlefun-ios-ci
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          mkdir -p "$YLF_CI_OUTPUT"
          echo "YLF_CI_OUTPUT=$YLF_CI_OUTPUT" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages"
          git diff --exit-code -- apps/ios/YunleFun.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Install requested iOS 16 runtime
        if: inputs.target == 'ios16'
        run: |
          set -o pipefail
          df -h
          xcodebuild -downloadPlatform iOS -buildVersion 16.0 \
            2>&1 | tee "$YLF_CI_OUTPUT/runtime-install.log"

      - name: Create isolated requested simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import os
          import json
          import subprocess

          runtime = os.environ["YLF_CI_RUNTIME"]
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          selected = [item for item in runtimes if item["identifier"] == runtime and item.get("isAvailable")]
          if len(selected) != 1:
              raise RuntimeError("The exact requested simulator runtime is unavailable; no version fallback is allowed")
          simulator = subprocess.check_output([
              "xcrun", "simctl", "create", "YunleFun CI",
              os.environ["YLF_CI_DEVICE"], runtime,
          ], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("id=" + simulator + "\n")
          print("Created isolated " + runtime + " test simulator: " + simulator)
          subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], check=True)
          PY

      - name: Native unit, integration and guest UI tests
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Debug -destination "platform=iOS Simulator,id=$YLF_CI_SIMULATOR" \
            -derivedDataPath "$YLF_CI_OUTPUT/debug" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$YLF_CI_OUTPUT/native-tests.xcresult" \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test \
            2>&1 | tee "$YLF_CI_OUTPUT/tests.log"

      - name: Export structured test results
        if: always() && steps.simulator.outputs.id != ''
        id: test-report
        env:
          YLF_CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -d "$YLF_CI_OUTPUT/native-tests.xcresult" ]]; then
            echo "No result bundle was produced; build logs remain in failure diagnostics."
            exit 0
          fi
          mkdir -p "$YLF_CI_OUTPUT/test-report"
          xcrun xcresulttool get test-results summary --path "$YLF_CI_OUTPUT/native-tests.xcresult" \
            > "$YLF_CI_OUTPUT/test-report/summary.json"
          xcrun xcresulttool get test-results tests --path "$YLF_CI_OUTPUT/native-tests.xcresult" \
            > "$YLF_CI_OUTPUT/test-report/tests.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path(os.environ["YLF_CI_OUTPUT"]) / "test-report"
          files = [directory / name for name in ["summary.json", "tests.json"]]
          for file in files:
              json.loads(file.read_text())
          receipt = {
              "sourceHead": os.environ["YLF_CI_SOURCE_HEAD"],
              "checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "target": os.environ["YLF_CI_TARGET"],
              "requestedRuntime": os.environ["YLF_CI_RUNTIME"],
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "macOS": subprocess.check_output(["sw_vers", "-productVersion"], text=True).strip(),
              "sha256": {file.name: hashlib.sha256(file.read_bytes()).hexdigest() for file in files},
          }
          (directory / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload structured test results
        if: always() && steps.test-report.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-test-report-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yunlefun-ios-ci/test-report/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Compile native Release for simulator
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$YLF_CI_OUTPUT/release" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build \
            2>&1 | tee "$YLF_CI_OUTPUT/release.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yunlefun-ios-ci/*.log
            ${{ runner.temp }}/yunlefun-ios-ci/native-tests.xcresult
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove isolated simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl shutdown "$YLF_CI_SIMULATOR" || true
          xcrun simctl delete "$YLF_CI_SIMULATOR"
