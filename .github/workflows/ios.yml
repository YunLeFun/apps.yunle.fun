name: Native iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - apps/ios/**
      - apps/mobile/ios/App/App/**
      - .github/workflows/ios*.yml

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native iOS · Xcode 27
    # GitHub's standard Xcode 27 image is currently a public preview.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Xcode and locked package versions
        env:
          YLF_CI_OUTPUT: ${{ runner.temp }}/yunlefun-ios-ci
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          mkdir -p "$YLF_CI_OUTPUT"
          echo "YLF_CI_OUTPUT=$YLF_CI_OUTPUT" >> "$GITHUB_ENV"
          echo "YLF_FIXTURE_RUN=$(python3 -c 'import uuid; print(str(uuid.uuid4()).upper())')" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages"
          git diff --exit-code -- apps/ios/YunleFun.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Create isolated iOS 27 simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          simulator = subprocess.check_output([
              "xcrun", "simctl", "create", "YunleFun CI",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro",
              "com.apple.CoreSimulator.SimRuntime.iOS-27-0",
          ], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("id=" + simulator + "\n")
          print("Created isolated iOS 27 test simulator: " + simulator)
          subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], check=True)
          PY

      - name: Native unit, integration and guest UI tests
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
          TEST_RUNNER_YUNLEFUN_FIXTURE_CLEANUP_RUN: ${{ env.YLF_FIXTURE_RUN }}
          TEST_RUNNER_YUNLEFUN_FIXTURE_CLEANUP_PHASE: collect
          TEST_RUNNER_YUNLEFUN_FIXTURE_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Debug -destination "platform=iOS Simulator,id=$YLF_CI_SIMULATOR" \
            -derivedDataPath "$YLF_CI_OUTPUT/debug" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$YLF_CI_OUTPUT/native-tests.xcresult" \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test \
            2>&1 | tee "$YLF_CI_OUTPUT/tests.log"

      - name: Verify fixture storage cleanup in a fresh app process
        if: always() && steps.simulator.outputs.id != ''
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
          TEST_RUNNER_YUNLEFUN_FIXTURE_CLEANUP_RUN: ${{ env.YLF_FIXTURE_RUN }}
          TEST_RUNNER_YUNLEFUN_FIXTURE_CLEANUP_PHASE: verify
          TEST_RUNNER_YUNLEFUN_FIXTURE_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Debug -destination "platform=iOS Simulator,id=$YLF_CI_SIMULATOR" \
            -derivedDataPath "$YLF_CI_OUTPUT/debug" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$YLF_CI_OUTPUT/fixture-cleanup.xcresult" \
            -only-testing:YunleFunTests/NativeGameRuntimeFixtureCleanupTests/testRemoveDeferredFixtureStoresInFreshProcess \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test-without-building \
            2>&1 | tee "$YLF_CI_OUTPUT/fixture-cleanup.log"
          container="$(xcrun simctl get_app_container "$YLF_CI_SIMULATOR" fun.yunle.apps.native-dev data)"
          export YLF_FIXTURE_CONTAINER="$container"
          export YLF_FIXTURE_LEDGER="$container/Library/Application Support/NativeGameFixtureCleanup/$YLF_FIXTURE_RUN.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          file = Path(os.environ["YLF_FIXTURE_LEDGER"])
          ledger = json.loads(file.read_text())
          assert ledger["runID"] == os.environ["YLF_FIXTURE_RUN"]
          assert ledger["entries"] and ledger["remainingIdentifiers"] == []
          verifier = ledger["verifiedByProcessID"]
          assert verifier > 0 and all(entry["processID"] != verifier for entry in ledger["entries"])
          root = Path(os.environ["YLF_FIXTURE_CONTAINER"]) / "tmp"
          assert all(not (root / entry["directory"]).exists() for entry in ledger["entries"])
          output = Path(os.environ["YLF_CI_OUTPUT"]) / "test-report"
          output.mkdir(parents=True, exist_ok=True)
          shutil.copy2(file, output / "fixture-cleanup.json")
          print(f"Verified {len(ledger['entries'])} owned stores absent after app process transition")
          PY

      - name: Export structured test results
        if: always() && steps.simulator.outputs.id != ''
        id: test-report
        env:
          YLF_CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -d "$YLF_CI_OUTPUT/native-tests.xcresult" ]]; then
            echo "No result bundle was produced; build logs remain in failure diagnostics."
            exit 0
          fi
          mkdir -p "$YLF_CI_OUTPUT/test-report"
          xcrun xcresulttool get test-results summary --path "$YLF_CI_OUTPUT/native-tests.xcresult" \
            > "$YLF_CI_OUTPUT/test-report/summary.json"
          xcrun xcresulttool get test-results tests --path "$YLF_CI_OUTPUT/native-tests.xcresult" \
            > "$YLF_CI_OUTPUT/test-report/tests.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          directory = Path(os.environ["YLF_CI_OUTPUT"]) / "test-report"
          files = [directory / name for name in ["summary.json", "tests.json"]]
          cleanup = directory / "fixture-cleanup.json"
          if cleanup.exists():
              files.append(cleanup)
          for file in files:
              json.loads(file.read_text())
          receipt = {
              "sourceHead": os.environ["YLF_CI_SOURCE_HEAD"],
              "checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "fixtureCleanupVerified": cleanup.exists(),
              "sha256": {file.name: hashlib.sha256(file.read_bytes()).hexdigest() for file in files},
          }
          (directory / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload structured test results
        if: always() && steps.test-report.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-test-report-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yunlefun-ios-ci/test-report/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Compile native Release for simulator
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/YunleFun.xcodeproj -scheme YunleFun \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$YLF_CI_OUTPUT/release" \
            -clonedSourcePackagesDirPath "$YLF_CI_OUTPUT/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build \
            2>&1 | tee "$YLF_CI_OUTPUT/release.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yunlefun-ios-ci/*.log
            ${{ runner.temp }}/yunlefun-ios-ci/native-tests.xcresult
            ${{ runner.temp }}/yunlefun-ios-ci/fixture-cleanup.xcresult
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove isolated simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          YLF_CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl shutdown "$YLF_CI_SIMULATOR" || true
          xcrun simctl delete "$YLF_CI_SIMULATOR"
