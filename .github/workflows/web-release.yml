name: Deploy Web release

on:
  push:
    tags:
      - 'web-v[0-9]*'

jobs:
  deploy:
    if: github.event.created && !github.event.deleted
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote the tagged main commit to EdgeOne
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          git push origin HEAD:refs/heads/edgeone-release
