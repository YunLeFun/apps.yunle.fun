apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

def versionMetadata = new Properties()
rootProject.file('version.properties').withInputStream { versionMetadata.load(it) }
def releaseVersionCodeValue = System.getenv('YUNLEFUN_ANDROID_VERSION_CODE')
def parsedReleaseVersionCode = releaseVersionCodeValue?.isInteger()
    ? releaseVersionCodeValue.toInteger()
    : null
if (releaseVersionCodeValue && (!parsedReleaseVersionCode || parsedReleaseVersionCode <= 0)) {
    throw new GradleException('YUNLEFUN_ANDROID_VERSION_CODE must be a positive integer')
}

def releaseSigningEnvironment = [
    storeFile: System.getenv('YUNLEFUN_ANDROID_RELEASE_STORE_FILE'),
    storePassword: System.getenv('YUNLEFUN_ANDROID_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('YUNLEFUN_ANDROID_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('YUNLEFUN_ANDROID_RELEASE_KEY_PASSWORD'),
]
def hasAnyReleaseSigningValue = releaseSigningEnvironment.values().any { it }
def hasCompleteReleaseSigningValues = releaseSigningEnvironment.values().every { it }
if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigningValues) {
    throw new GradleException('Android release signing variables are only partially configured')
}

android {
    namespace = "fun.yunle.apps"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fun.yunle.apps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode parsedReleaseVersionCode ?: 1
        versionName versionMetadata.getProperty('versionName')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (hasCompleteReleaseSigningValues) {
            release {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            if (hasCompleteReleaseSigningValues) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.03.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation3:navigation3-runtime:1.2.1'
    implementation 'androidx.navigation3:navigation3-ui:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.browser:browser:1.9.0"
    implementation "com.google.android.material:material:1.12.0"
    // Required by the app-package WeChat callback activities.
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}


gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.project == project && task.name in ['packageRelease', 'signReleaseBundle']
    }
    if (releasePackagingRequested && (!hasCompleteReleaseSigningValues || !parsedReleaseVersionCode)) {
        throw new GradleException(
            'Android release packaging requires YUNLEFUN_ANDROID_VERSION_CODE and the complete ' +
                'YUNLEFUN_ANDROID_RELEASE_* signing environment'
        )
    }
}
