name: YunleFun
configs:
  Debug: debug
  Release: release
  Benchmark: release
options:
  bundleIdPrefix: fun.yunle
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '27.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '4'
    FEEDBACK_APP_GROUP: group.fun.yunle.apps
    DEVELOPMENT_TEAM: QT792GAY4C
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.29.0
targets:
  YunleFun:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftDraw
      - target: YunleFunFeedbackShare
        embed: true
        link: false
    info:
      path: YunleFun/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        YunleFeedbackAppGroup: $(FEEDBACK_APP_GROUP)
        NSCameraUsageDescription: 用于扫描云应用和个人工坊二维码。
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: yunlefun
            CFBundleURLSchemes: [yunlefun]
    sources:
      - path: YunleFun
      - path: SharedFeedback
      - path: ../mobile/ios/App/App/WebViewController.swift
      - path: ../mobile/ios/App/App/HostAuthorizationProtocol.swift
      - path: ../mobile/ios/App/App/InAppWebViewPlugin.swift
      - path: ../mobile/ios/App/App/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps
        CODE_SIGN_ENTITLEMENTS: YunleFun/YunleFun.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 云乐坊
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          FEEDBACK_APP_GROUP: group.fun.yunle.apps.native-dev
          PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.native-dev
          INFOPLIST_KEY_CFBundleDisplayName: 云乐坊 Native
        Benchmark:
          FEEDBACK_APP_GROUP: group.fun.yunle.apps.benchmark-dev
          PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.benchmark-dev
          INFOPLIST_KEY_CFBundleDisplayName: 云乐坊 Benchmark
  YunleFunFeedbackShare:
    type: app-extension
    platform: iOS
    sources:
      - path: YunleFunFeedbackShare
      - path: SharedFeedback
      - path: YunleFun/Models/FeedbackScreenshot.swift
      - path: YunleFun/Models/FeedbackChannel.swift
    info:
      path: YunleFunFeedbackShare/Info.plist
      properties:
        CFBundleDisplayName: 反馈给云乐坊
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        YunleFeedbackAppGroup: $(FEEDBACK_APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FeedbackShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 3
    entitlements:
      path: YunleFunFeedbackShare/YunleFunFeedbackShare.entitlements
      properties:
        com.apple.security.application-groups: [$(FEEDBACK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.feedback-share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.native-dev.feedback-share
          FEEDBACK_APP_GROUP: group.fun.yunle.apps.native-dev
        Benchmark:
          PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.benchmark-dev.feedback-share
          FEEDBACK_APP_GROUP: group.fun.yunle.apps.benchmark-dev
  YunleFunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YunleFunTests]
    dependencies:
      - target: YunleFun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.native-tests
  YunleFunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YunleFunUITests]
    dependencies:
      - target: YunleFun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.native-uitests
        TEST_TARGET_NAME: YunleFun
  YunleFunLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiveValidation]
    dependencies:
      - target: YunleFun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.live-tests
  YunleFunStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoreKitValidation
      - path: YunleFunTests/BillingTestSupport.swift
    dependencies:
      - target: YunleFun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.storekit-tests
  YunleFunBenchmarksTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Benchmarks]
    dependencies:
      - target: YunleFun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.apps.benchmark-tests
        TEST_TARGET_NAME: YunleFun
schemes:
  YunleFun:
    build:
      targets:
        YunleFun: all
        YunleFunTests: [test]
        YunleFunUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [YunleFunTests, YunleFunUITests]
    archive:
      config: Release
  YunleFunBenchmarks:
    build:
      targets:
        YunleFun: all
        YunleFunBenchmarksTests: [test]
    run:
      config: Benchmark
    test:
      config: Benchmark
      targets: [YunleFunBenchmarksTests]
  YunleFunLiveValidation:
    build:
      targets:
        YunleFun: all
        YunleFunLiveTests: [test]
    test:
      config: Debug
      targets: [YunleFunLiveTests]
  YunleFunStoreKitValidation:
    build:
      targets:
        YunleFun: all
        YunleFunStoreKitTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKitValidation/Fixtures/Products.storekit
    test:
      config: Debug
      targets: [YunleFunStoreKitTests]
