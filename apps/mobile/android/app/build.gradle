apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def packageMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def releaseVersionCodeValue = System.getenv('YUNLEFUN_ANDROID_VERSION_CODE')
def parsedReleaseVersionCode = releaseVersionCodeValue?.isInteger()
    ? releaseVersionCodeValue.toInteger()
    : null
if (releaseVersionCodeValue && (!parsedReleaseVersionCode || parsedReleaseVersionCode <= 0)) {
    throw new GradleException('YUNLEFUN_ANDROID_VERSION_CODE must be a positive integer')
}

def releaseSigningEnvironment = [
    storeFile: System.getenv('YUNLEFUN_ANDROID_RELEASE_STORE_FILE'),
    storePassword: System.getenv('YUNLEFUN_ANDROID_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('YUNLEFUN_ANDROID_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('YUNLEFUN_ANDROID_RELEASE_KEY_PASSWORD'),
]
def hasAnyReleaseSigningValue = releaseSigningEnvironment.values().any { it }
def hasCompleteReleaseSigningValues = releaseSigningEnvironment.values().every { it }
if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigningValues) {
    throw new GradleException('Android release signing variables are only partially configured')
}

android {
    namespace = "fun.yunle.apps"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fun.yunle.apps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode parsedReleaseVersionCode ?: 1
        versionName packageMetadata.version.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasCompleteReleaseSigningValues) {
            release {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasCompleteReleaseSigningValues) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.browser:browser:1.9.0"
    implementation "com.google.android.material:material:1.12.0"
    // Required by the app-package WeChat callback activities.
    implementation "org.apache.cordova:framework:$cordovaAndroidVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.project == project && task.name in ['packageRelease', 'signReleaseBundle']
    }
    if (releasePackagingRequested && (!hasCompleteReleaseSigningValues || !parsedReleaseVersionCode)) {
        throw new GradleException(
            'Android release packaging requires YUNLEFUN_ANDROID_VERSION_CODE and the complete ' +
                'YUNLEFUN_ANDROID_RELEASE_* signing environment'
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
